<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BatFamília • Arquivo Gotham</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🦇</span>
        <span class="logo-text">BatFamília</span>
        <span class="logo-sub">Arquivo Gotham</span>
      </div>
      <nav class="main-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="#home" data-page="home" class="active">Home</a></li>
          <li><a href="#journey" data-page="journey">Jornada</a></li>
          <li><a href="#catalog" data-page="catalog">Catálogo</a></li>
          <li><a href="#characters" data-page="characters">Personagens</a></li>
          <li><a href="#progress" data-page="progress">Progresso</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- HOME -->
    <section id="page-home" class="page active" aria-label="Home">
      <div class="page-container" id="home-container"></div>
    </section>

    <!-- JORNADA -->
    <section id="page-journey" class="page" aria-label="Jornada">
      <div class="page-container" id="journey-container"></div>
    </section>

    <!-- CATÁLOGO -->
    <section id="page-catalog" class="page" aria-label="Catálogo">
      <div class="page-container" id="catalog-container"></div>
    </section>

    <!-- PERSONAGENS -->
    <section id="page-characters" class="page" aria-label="Personagens">
      <div class="page-container" id="characters-container"></div>
    </section>

    <!-- PROGRESSO -->
    <section id="page-progress" class="page" aria-label="Progresso">
      <div class="page-container" id="progress-container"></div>
    </section>
  </main>

  <!-- MODAL DE DETALHES -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Fechar detalhes">✕</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- MODAL DE FORMULÁRIO (CRIAR/EDITAR) -->
  <div id="form-modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal form-modal" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
      <button class="modal-close" aria-label="Fechar formulário">✕</button>
      <div class="modal-content" id="form-modal-content">
        <h2 id="form-modal-title">Adicionar Obra</h2>
        <form id="item-form">
          <div class="form-row">
            <div class="form-group">
              <label for="form-title">Título *</label>
              <input type="text" id="form-title" required />
            </div>
            <div class="form-group">
              <label for="form-title-pt">Título em PT</label>
              <input type="text" id="form-title-pt" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-year-start">Ano de início</label>
              <input type="number" id="form-year-start" />
            </div>
            <div class="form-group">
              <label for="form-year-end">Ano de fim</label>
              <input type="number" id="form-year-end" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-type">Tipo</label>
              <select id="form-type">
                <option value="">Selecione</option>
                <option value="Filme">Filme</option>
                <option value="Série">Série</option>
                <option value="HQ">HQ</option>
                <option value="Animação">Animação</option>
                <option value="Especial">Especial</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-format">Formato</label>
              <select id="form-format">
                <option value="">Selecione</option>
                <option value="Live-action">Live-action</option>
                <option value="Animado">Animado</option>
                <option value="CGI">CGI</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-universe">Universo</label>
              <input type="text" id="form-universe" placeholder="Ex: DC, Elseworlds" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-priority">Prioridade</label>
              <select id="form-priority">
                <option value="">Selecione</option>
                <option value="core">Essencial</option>
                <option value="important">Importante</option>
                <option value="extra">Extra</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-order">Ordem na Jornada</label>
              <input type="number" id="form-order" step="1" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-duration">Duração (min)</label>
              <input type="number" id="form-duration" />
            </div>
            <div class="form-group">
              <label for="form-episodes">Episódios</label>
              <input type="number" id="form-episodes" />
            </div>
            <div class="form-group">
              <label for="form-seasons">Temporadas</label>
              <input type="number" id="form-seasons" />
            </div>
          </div>
          <div class="form-group">
            <label for="form-poster">URL da Capa</label>
            <input type="url" id="form-poster" placeholder="https://exemplo.com/capa.jpg" />
            <div id="poster-preview" style="margin-top: 0.5rem; width: 100px; height: 150px; background: #1c1820; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #7a727a; font-size: 0.8rem;">
              <span id="poster-placeholder">Pré-visualização</span>
              <img id="poster-preview-img" src="" alt="Pré-visualização" style="width:100%; height:100%; object-fit:cover; display:none;" />
            </div>
          </div>
          <div class="form-group">
            <label for="form-synopsis">Sinopse</label>
            <textarea id="form-synopsis" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label for="form-characters">Personagens (separados por vírgula)</label>
            <input type="text" id="form-characters" placeholder="Batman, Robin, Coringa" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-rating">Sua nota (0-10)</label>
              <input type="number" id="form-rating" min="0" max="10" step="0.1" />
            </div>
            <div class="form-group">
              <label for="form-review">Comentário</label>
              <input type="text" id="form-review" placeholder="O que você achou?" />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="button" class="btn-secondary" id="form-cancel">Cancelar</button>
            <button type="button" class="btn-danger" id="form-delete" style="display:none;">Excluir</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>🦇 <span>BatFamília • Arquivo de Gotham</span> — dados fornecidos pelo <strong>Oráculo</strong></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
